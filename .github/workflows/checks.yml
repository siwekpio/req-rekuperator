# SPDX-License-Identifier: GPL-3.0-only
name: Static and browser checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install aiohttp playwright
      - name: Unit and protocol regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Python syntax
        run: python -m compileall -q custom_components tests
      - name: JavaScript syntax and navigation
        run: |
          node --check www/rekuperator-js.js
          node tests/test_navigation_logic.js
      - name: Install browser for integration tests
        run: python -m playwright install --with-deps chromium
      - name: Browser regression tests (mocked HA, no physical device)
        run: |
          set -eu
          for test_script in tests/browser*_test.py; do
            python "$test_script"
          done
