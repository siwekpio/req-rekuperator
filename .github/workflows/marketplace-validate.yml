# SPDX-License-Identifier: GPL-3.0-only
name: Marketplace readiness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  hacs:
    # Official validator rejects private repositories; cannot run until publication.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    steps:
      - name: Validate with HACS/Marketplace
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # validated main on 2026-11-24
        with:
          category: integration
          comment: false
  hassfest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate integration with hassfest
        uses: home-assistant/actions/hassfest@9e9565e68f5a70d874202871f4c4064d23814235 # master on 2026-11-24
      - name: Strict catalog brand image validation
        shell: bash
        run: |
          set -euo pipefail
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          docker run --rm \
            -v "$PWD/custom_components/req_rekuperator:/github/workspace/custom_components/req_rekuperator" \
            ghcr.io/home-assistant/hassfest:latest 2>&1 | tee "$log"
          # Match the catalog policy: BRAND_IMAGES warnings block new integrations.
          if grep -F "[WARNING] [BRAND_IMAGES]" "$log"; then
            exit 1
          fi
